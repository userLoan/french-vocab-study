<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Cahier de révision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: bàn học. Rail gáy sổ xanh mực bên trái (4 khu), mỗi màn hình chỉ một việc chính trên tờ giấy ngà ở giữa. */
:root{
  --desk:#f1e9d6; --paper:#fbf7ed; --sheet:#fffdf7; --ink:#163a5f; --ink-soft:#56708a; --ink-faint:#8a9bb0;
  --mustard:#d6a22a; --mustard-soft:#f5e3a8; --mustard-ink:#5a4209;
  --sage:#dfe9d6; --sage-ink:#3d614e; --coral:#b95e48; --coral-soft:#f6e2da;
  --lv0:#d9d3c4; --lv1:#e8b75a; --lv2:#8fb39a; --lv3:#3d614e;
  --line:rgba(22,58,95,.13); --rule:rgba(22,58,95,.06);
  --spine:#163a5f; --on-spine:#f6eedb; --on-spine-soft:rgba(246,238,219,.62);
  --shadow:0 1px 0 rgba(22,58,95,.05),0 14px 30px -18px rgba(22,58,95,.4);
  --s1:#f8efd9; --s2:#f3df9e; --s3:#dce6d4; --s4:#f3d8cd; --s5:#d8e6e4; --s6:#eadbf0; --s7:#ecd9ce;
  --soft:0 18px 45px rgba(76,63,35,.10),inset 0 0 0 1px rgba(118,95,51,.13); --soft-hover:0 24px 50px rgba(76,63,35,.16),inset 0 0 0 1px rgba(118,95,51,.18);
  --glow:rgba(255,255,255,.85); --tapeA:rgba(255,255,255,.5); --corner:#d8c9aa; --ruled:rgba(22,58,95,.06); --track:rgba(22,58,95,.12);
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.23,1,.32,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#101b27; --paper:#172534; --sheet:#1b2b3c; --ink:#ece3cc; --ink-soft:#a9b6c4; --ink-faint:#7b8b9c;
  --mustard:#e2b453; --mustard-soft:#4a3b16; --mustard-ink:#f6e3ad;
  --sage:#1f3a2c; --sage-ink:#9fd2b2; --coral:#ec917a; --coral-soft:#43251d;
  --lv0:#34414f; --lv1:#c9963a; --lv2:#5f8f71; --lv3:#9fd2b2;
  --line:rgba(236,227,204,.14); --rule:rgba(236,227,204,.05);
  --spine:#0b1622; --on-spine:#ece3cc; --on-spine-soft:rgba(236,227,204,.58);
    --s1:#1f2d3c; --s2:#2d2a1b; --s3:#1e3128; --s4:#33251f; --s5:#1c2e33; --s6:#2a2434; --s7:#2e2620;
  --soft:0 18px 45px rgba(0,0,0,.45),inset 0 0 0 1px rgba(236,227,204,.10); --soft-hover:0 24px 50px rgba(0,0,0,.55),inset 0 0 0 1px rgba(236,227,204,.16);
  --glow:rgba(60,90,120,.25); --tapeA:rgba(236,227,204,.14); --corner:#3a4a5c; --ruled:rgba(236,227,204,.05); --track:rgba(236,227,204,.16);
  --shadow:0 1px 0 rgba(0,0,0,.25),0 14px 30px -18px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#101b27; --paper:#172534; --sheet:#1b2b3c; --ink:#ece3cc; --ink-soft:#a9b6c4; --ink-faint:#7b8b9c;
  --mustard:#e2b453; --mustard-soft:#4a3b16; --mustard-ink:#f6e3ad;
  --sage:#1f3a2c; --sage-ink:#9fd2b2; --coral:#ec917a; --coral-soft:#43251d;
  --lv0:#34414f; --lv1:#c9963a; --lv2:#5f8f71; --lv3:#9fd2b2;
  --line:rgba(236,227,204,.14); --rule:rgba(236,227,204,.05);
  --spine:#0b1622; --on-spine:#ece3cc; --on-spine-soft:rgba(236,227,204,.58);
    --s1:#1f2d3c; --s2:#2d2a1b; --s3:#1e3128; --s4:#33251f; --s5:#1c2e33; --s6:#2a2434; --s7:#2e2620;
  --soft:0 18px 45px rgba(0,0,0,.45),inset 0 0 0 1px rgba(236,227,204,.10); --soft-hover:0 24px 50px rgba(0,0,0,.55),inset 0 0 0 1px rgba(236,227,204,.16);
  --glow:rgba(60,90,120,.25); --tapeA:rgba(236,227,204,.14); --corner:#3a4a5c; --ruled:rgba(236,227,204,.05); --track:rgba(236,227,204,.16);
  --shadow:0 1px 0 rgba(0,0,0,.25),0 14px 30px -18px rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.6}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}

/* ---------- rail ---------- */
.rail{background:var(--spine);color:var(--on-spine);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:6px;padding:24px 0 22px 16px;border-right:2px dashed rgba(246,238,219,.25)}
.brand{display:flex;align-items:center;gap:12px;padding:0 16px 22px 4px}
.seal{width:44px;height:44px;border-radius:50%;border:1.5px dashed var(--on-spine-soft);display:grid;place-items:center;font-family:var(--display);font-size:25px;font-style:italic;color:var(--mustard);flex:none;transform:rotate(-8deg)}
.brand b{display:block;font-family:var(--display);font-style:italic;font-weight:600;font-size:29px;line-height:1;letter-spacing:-.02em}
.brand small{display:block;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--on-spine-soft);margin-top:5px;font-weight:700}
.nav{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:8px 0 0 8px;font-weight:700;font-size:14.5px;color:var(--on-spine-soft);position:relative}
.nav svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav .fr-l{display:block;font-family:var(--display);font-style:italic;font-weight:400;font-size:12px;opacity:.75;line-height:1.1}
.nav:hover{color:var(--on-spine);background:rgba(246,238,219,.06)}
.nav:focus-visible{outline:2px solid var(--mustard);outline-offset:-2px}
.nav[aria-current="page"]{background:var(--desk);color:var(--ink);box-shadow:inset 4px 0 0 var(--mustard)}
.nav .badge{margin-left:auto;font-size:11px;font-variant-numeric:tabular-nums;background:var(--mustard);color:var(--spine);border-radius:999px;padding:0 8px;line-height:19px;font-weight:800}
.nav.theme{margin-top:auto;font-size:13.5px}
.nav.theme + .rail-foot{margin-top:6px}
.rail-foot{margin-top:auto;padding:16px 16px 0 6px;border-top:1px dashed rgba(246,238,219,.22);font-size:12.5px;color:var(--on-spine-soft)}
.rail-foot b{display:block;font-family:var(--display);font-size:26px;color:var(--on-spine);font-weight:600;line-height:1.1}

/* ---------- desk ---------- */
.desk{min-width:0;padding-inline:clamp(16px,4.5vw,56px);padding-block:30px 80px}
.view{max-width:1060px;margin:0 auto}
.head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;margin-bottom:26px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin:0}
h1{font-family:var(--display);font-weight:600;font-size:clamp(30px,3.8vw,44px);line-height:1.05;letter-spacing:-.02em;margin:4px 0 0;text-wrap:balance}
h1 em{font-weight:400}
h2{font-family:var(--display);font-weight:600;font-size:clamp(22px,2.6vw,30px);line-height:1.12;letter-spacing:-.015em;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.25;margin:0}
.lede{color:var(--ink-soft);margin:6px 0 0;max-width:62ch}
.muted{color:var(--ink-soft)}
.small{font-size:13px}
.back{all:unset;cursor:pointer;font-size:13px;font-weight:700;color:var(--ink-soft);display:inline-flex;gap:6px;align-items:center;margin-bottom:14px}
.back:hover{color:var(--ink)}
.back:focus-visible{outline:2px solid var(--mustard);outline-offset:3px}

.sheet{position:relative;background:var(--sheet);border:1px solid var(--line);box-shadow:var(--shadow);padding:clamp(20px,3vw,34px)}
.sheet.fold{clip-path:polygon(0 0,calc(100% - 30px) 0,100% 30px,100% 100%,0 100%)}
.sheet.fold::after{content:"";position:absolute;top:0;right:0;width:30px;height:30px;background:linear-gradient(225deg,var(--desk) 50%,var(--mustard-soft) 50%)}
.paper{background:var(--paper);border:1px solid var(--line);padding:18px 20px}
.tape{display:inline-block;background:var(--mustard-soft);color:var(--mustard-ink);font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;transform:rotate(-1.5deg)}
.tape.navy{background:var(--ink);color:var(--sheet)}
.tape.sage{background:var(--sage);color:var(--sage-ink)}

.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:14px;padding:11px 20px;background:var(--ink);color:var(--sheet);box-shadow:3px 3px 0 var(--mustard);text-align:center}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--mustard)}
.btn:active{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--mustard)}
.btn.big{font-size:16px;padding:15px 28px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--ink);transform:none}
.btn.good{background:var(--sage-ink);color:var(--sheet);box-shadow:3px 3px 0 var(--sage)}
.btn.bad{background:transparent;color:var(--coral);border:1.5px solid var(--coral);box-shadow:none}
.btn.mid{background:transparent;color:var(--mustard-ink);border:1.5px solid var(--mustard);box-shadow:none}
.btn:focus-visible{outline:2px solid var(--mustard);outline-offset:3px}
.btn:disabled{opacity:.35;pointer-events:none;box-shadow:none}
.btn kbd{font:600 11px var(--body);opacity:.6;border:1px solid currentColor;border-radius:3px;padding:0 4px}
@media (prefers-reduced-motion:reduce){.btn:hover,.btn:active{transform:none}}

.seg{display:inline-flex;border:1.5px solid var(--ink);background:var(--sheet)}
.seg button{all:unset;cursor:pointer;padding:8px 16px;font-weight:700;font-size:13.5px;color:var(--ink-soft);border-left:1.5px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.seg button:focus-visible{outline:2px solid var(--mustard);outline-offset:-2px}

.fr{color:var(--ink);font-weight:600;cursor:pointer;text-decoration:underline dotted var(--mustard);text-decoration-thickness:2px;text-underline-offset:4px}
.fr:hover{text-decoration-style:solid}
.fr:focus-visible{outline:2px solid var(--mustard);border-radius:2px}
.say{all:unset;cursor:pointer;display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);color:var(--ink-soft);flex:none}
.say:hover{border-color:var(--ink);color:var(--ink)}
.say svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.say:focus-visible{outline:2px solid var(--mustard)}

/* mastery bar */
.mbar{display:flex;height:8px;background:var(--lv0);overflow:hidden;border-radius:1px}
.mbar i{display:block;height:100%}
.mbar .l1{background:var(--lv1)} .mbar .l2{background:var(--lv2)} .mbar .l3{background:var(--lv3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;display:inline-block}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.l0{background:var(--lv0)} .dot.l1{background:var(--lv1)} .dot.l2{background:var(--lv2)} .dot.l3{background:var(--lv3)}

/* ---------- today ---------- */
.today-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:24px;align-items:start}
.start h2{margin:12px 0 4px}
.plan{list-style:none;padding:0;margin:22px 0 24px;display:grid;gap:0;border-top:1px solid var(--line)}
.plan li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line)}
.plan b{font-family:var(--display);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;text-align:right}
.plan span small{display:block;color:var(--ink-soft);font-size:12.5px}
.opt-row{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;margin-top:18px}
.opt-row label{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:6px}
.side-stack{display:grid;gap:20px}
.cal,.cal-h{max-width:280px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.cal i{aspect-ratio:1;max-width:100%;background:var(--rule);border:1px solid var(--line);display:block;position:relative}
.cal i.on{background:var(--sage-ink);border-color:transparent}
.cal i.on2{background:var(--lv2);border-color:transparent}
.cal i.today{outline:2px solid var(--mustard);outline-offset:1px}
.cal-h{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;font-size:10px;font-weight:800;color:var(--ink-faint);text-align:center;margin-top:12px}
.streak{display:flex;align-items:baseline;gap:10px}
.streak b{font-family:var(--display);font-size:40px;font-weight:600;line-height:1}
.cont{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center}
.cont .tape{grid-column:1/-1;justify-self:start}

/* ---------- lessons ---------- */
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:18px}
.lcard{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:10px;background:var(--sheet);border:1px solid var(--line);box-shadow:var(--shadow);padding:18px 20px 16px;position:relative;min-width:0}
.lcard:hover{border-color:var(--ink)}
.lcard:focus-visible{outline:2px solid var(--mustard);outline-offset:3px}
.lcard .top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--ink-soft);text-transform:uppercase}
.lcard h3{font-size:21px}
.lcard .meta{font-size:13px;color:var(--ink-soft)}
.prog{height:6px;background:var(--rule);border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--sage-ink)}
.pill{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border:1.5px solid currentColor}
.pill.new{color:var(--mustard-ink);background:var(--mustard-soft);border-color:transparent}
.pill.done{color:var(--sage-ink)}

.steps{display:flex;gap:6px;margin:22px 0 24px;border-bottom:1.5px solid var(--ink);flex-wrap:wrap}
.step{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 18px 9px;font-weight:700;font-size:14px;color:var(--ink-soft);border:1.5px solid transparent;border-bottom:0;margin-bottom:-1.5px}
.step b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;font-size:12px;font-variant-numeric:tabular-nums}
.step[aria-selected="true"]{background:var(--sheet);color:var(--ink);border-color:var(--ink);border-bottom:1.5px solid var(--sheet);box-shadow:inset 0 3px 0 var(--mustard)}
.step[aria-selected="true"] b{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.step:focus-visible{outline:2px solid var(--mustard)}
.step small{margin-left:2px;font-weight:600;color:var(--ink-faint);font-variant-numeric:tabular-nums}

.learn{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:start}
.toc{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px)}
.toc button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;padding:7px 10px;font-size:13.5px;line-height:1.35;color:var(--ink-soft);border-left:2px solid var(--line)}
.toc button:hover{color:var(--ink)}
.toc button[aria-current="true"]{color:var(--ink);font-weight:700;border-left-color:var(--mustard);background:var(--paper)}
.toc button .n{font-family:var(--display);font-style:italic;font-variant-numeric:tabular-nums}
.toc button.seen .n{color:var(--sage-ink)}
.toc button:focus-visible{outline:2px solid var(--mustard)}
.concept{min-width:0}
.concept .count{font-family:var(--display);font-style:italic;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.concept h2{margin:10px 0 18px}
.concept .body{font-size:16.5px;line-height:1.7;max-width:70ch}
.concept .body p{margin:0 0 12px}
.concept .body ul,.concept .body ol{margin:0 0 12px;padding-left:20px}
.concept .body li{margin:4px 0}
.concept .tip{display:block;background:var(--mustard-soft);color:var(--mustard-ink);padding:10px 14px;font-size:14px;margin-top:14px;border-left:3px solid var(--mustard)}
.concept .tip .fr{color:var(--mustard-ink)}
.tbl{overflow-x:auto;margin:6px 0 14px}
table{border-collapse:collapse;font-size:15px;width:100%}
td,th{padding:7px 14px 7px 0;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:800}
tr:first-child td{border-top:1px solid var(--line)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:26px;padding-top:18px;border-top:1px dashed var(--line);flex-wrap:wrap}

.fixes{counter-reset:fx;border-top:1px solid var(--line)}
.fix{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:4px 16px;align-items:start;padding:14px 4px 14px 44px;border-bottom:1px solid var(--line);position:relative;counter-increment:fx}
.fix::before{content:counter(fx,decimal-leading-zero);position:absolute;left:4px;top:15px;font-family:var(--display);font-style:italic;color:var(--ink-soft)}
.fix .w{color:var(--coral);text-decoration:line-through;text-decoration-thickness:1.5px}
.fix .arrow{color:var(--ink-faint)}
.fix .why{grid-column:1/-1;font-size:13.5px;color:var(--ink-soft)}

/* ---------- quiz / session ---------- */
.qtop{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.qtop .bar{flex:1;height:8px;background:var(--rule);border:1px solid var(--line)}
.qtop .bar i{display:block;height:100%;background:var(--mustard);transition:width .3s var(--ease)}
.qtop .n{font-family:var(--display);font-style:italic;color:var(--ink-soft);font-variant-numeric:tabular-nums;min-width:60px;text-align:right}
.qcard{background:var(--sheet);border:1px solid var(--line);box-shadow:var(--shadow);padding:clamp(22px,4vw,44px);min-height:360px;display:flex;flex-direction:column;gap:18px;position:relative;background-image:linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% 32px;background-position:0 74px}
.qcard .kind{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.qcard .lab{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.qcard .prompt{font-family:var(--display);font-weight:600;font-size:clamp(30px,5vw,54px);line-height:1.08;letter-spacing:-.02em;overflow-wrap:anywhere;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qcard .prompt.sm{font-size:clamp(22px,3.2vw,32px);line-height:1.25}
.qcard .q{font-size:clamp(19px,2.4vw,24px);line-height:1.45}
.qcard .ans{border-top:1.5px dashed var(--line);padding-top:16px}
.qcard .ans .main{font-family:var(--display);font-size:clamp(22px,3vw,30px);font-weight:600}
.qcard .ans .en{font-style:italic;color:var(--ink-soft)}
.qcard .ans .nt{font-size:14px;color:var(--ink-soft);margin-top:6px}
.qcard input[type=text]{font:inherit;font-size:20px;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--ink-soft);padding:8px 2px;width:100%}
.qcard input[type=text]:focus{outline:none;border-bottom-color:var(--mustard)}
.qacts{display:flex;flex-wrap:wrap;gap:12px;margin-top:auto}
.qacts .btn{flex:1 1 150px}
.opts{display:grid;gap:10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;border:1.5px solid var(--line);padding:12px 16px;background:var(--sheet);display:flex;gap:12px;align-items:baseline;font-size:17px}
.opt kbd{font:700 12px var(--body);color:var(--ink-faint);border:1px solid var(--line);padding:0 6px;border-radius:3px}
.opt:hover{border-color:var(--ink)}
.opt:focus-visible{outline:2px solid var(--mustard)}
.opt.ok{border-color:var(--sage-ink);color:var(--sage-ink);font-weight:700;background:var(--sage)}
.opt.no{border-color:var(--coral);color:var(--coral)}
.fb{font-size:15px;padding:12px 16px;border-left:3px solid}
.fb.ok{border-color:var(--sage-ink);background:var(--sage);color:var(--sage-ink)}
.fb.no{border-color:var(--coral);background:var(--coral-soft);color:var(--coral)}
.fb.warn{border-color:var(--mustard);background:var(--mustard-soft);color:var(--mustard-ink)}
.fb b{font-weight:800}
.stamp{position:absolute;top:22px;right:24px;width:88px;height:88px;border-radius:50%;border:2.5px solid currentColor;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;text-align:center;line-height:1.1;transform:rotate(-10deg);pointer-events:none}
.stamp.ok{color:var(--sage-ink)} .stamp.no{color:var(--coral)}
@media (prefers-reduced-motion:no-preference){.stamp{animation:stamp .22s var(--ease)}}
@keyframes stamp{from{transform:rotate(-10deg) scale(1.25);opacity:0}to{transform:rotate(-10deg) scale(1);opacity:1}}
.qdots{display:flex;flex-wrap:wrap;gap:5px;margin-top:18px}
.qdots button{all:unset;cursor:pointer;width:22px;height:22px;display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--ink-soft);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.qdots button.ok{background:var(--sage-ink);color:var(--sheet);border-color:transparent}
.qdots button.no{background:var(--coral);color:var(--sheet);border-color:transparent}
.qdots button[aria-current="true"]{outline:2px solid var(--mustard);outline-offset:1px}
.qdots button:focus-visible{outline:2px solid var(--ink)}

.verdict{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;padding:16px 20px;border:2px solid}
.verdict .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:800;color:var(--sheet)}
.verdict div{display:grid;gap:2px;min-width:0}
.verdict b{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.15}
.verdict span{font-size:16px}
.verdict small{font-size:13px;opacity:.85;margin-top:2px}
.verdict s{text-decoration-thickness:2px}
.verdict.ok{border-color:var(--sage-ink);background:var(--sage);color:var(--sage-ink)}
.verdict.ok .ic{background:var(--sage-ink)}
.verdict.warn{border-color:var(--mustard);background:var(--mustard-soft);color:var(--mustard-ink)}
.verdict.warn .ic{background:var(--mustard);color:var(--spine)}
.verdict.no{border-color:var(--coral);background:var(--coral-soft);color:var(--coral)}
.verdict.no .ic{background:var(--coral)}
.verdict .fr{color:inherit;font-weight:800}
@media (prefers-reduced-motion:no-preference){.verdict{animation:pop .22s var(--ease)}.verdict.no{animation:shake .32s var(--ease)}}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.qcard input.is-ok{border-bottom-color:var(--sage-ink);color:var(--sage-ink);font-weight:700}
.qcard input.is-accent{border-bottom-color:var(--mustard);color:var(--mustard-ink)}
.qcard input.is-no{border-bottom-color:var(--coral);color:var(--coral);text-decoration:line-through}
.qcard.r-ok{box-shadow:inset 6px 0 0 var(--sage-ink),var(--shadow)}
.qcard.r-no{box-shadow:inset 6px 0 0 var(--coral),var(--shadow)}
.tally{display:flex;gap:10px;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.tally .t-ok{color:var(--sage-ink)} .tally .t-no{color:var(--coral)}
.keys{font-size:12px;color:var(--ink-faint);margin-top:14px}
.summary{text-align:center;padding:clamp(28px,5vw,56px) clamp(20px,4vw,48px)}
.summary .big{font-family:var(--display);font-size:64px;font-weight:600;line-height:1}
.sum-row{display:flex;justify-content:center;gap:0;margin:20px 0 26px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.sum-row div{padding:0 24px;border-left:1px dashed var(--line)}
.sum-row div:first-child{border-left:0}
.sum-row b{display:block;font-family:var(--display);font-size:30px;font-weight:600}
.sum-row span{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}

/* ---------- lexique ---------- */
.search{display:flex;gap:10px;align-items:center;border-bottom:2px solid var(--ink-soft);padding:4px 2px;max-width:420px;flex:1 1 260px}
.search svg{width:18px;height:18px;stroke:var(--ink-soft);fill:none;stroke-width:2}
.search input{all:unset;flex:1;font-size:16px;min-width:0}
.search:focus-within{border-bottom-color:var(--mustard)}
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:18px}
.tcard{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:12px;background:var(--sheet);border:1px solid var(--line);box-shadow:var(--shadow);padding:20px 22px;min-width:0}
.tcard:hover{border-color:var(--ink)}
.tcard:focus-visible{outline:2px solid var(--mustard);outline-offset:3px}
.tcard h3{font-size:21px}
.tcard .meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.tcard .due{color:var(--mustard-ink);background:var(--mustard-soft);font-weight:800;padding:0 7px;font-size:12px}
.chapters{border-top:1px solid var(--line)}
.chap{display:grid;grid-template-columns:minmax(0,1fr) 160px auto;gap:10px 22px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line)}
.chap h3{font-size:18px}
.chap .meta{font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.chap .acts{display:flex;gap:8px}
.chap .acts .btn{padding:8px 14px;font-size:13px}
.words{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:0;border-top:1px solid var(--line);border-left:1px solid var(--line);margin:4px 0 8px}
.w{padding:11px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0;background:var(--sheet);display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 10px;align-items:baseline}
.w .dot{margin-top:7px;grid-row:1/4}
.w .fr{font-family:var(--display);font-size:17.5px;line-height:1.3}
.w .vi{font-size:14px}
.w .en{font-size:12.5px;color:var(--ink-soft);font-style:italic}
.w .nt{font-size:12px;color:var(--ink-soft);grid-column:2;margin-top:3px}
.w .tag{font-size:11px;color:var(--ink-faint);grid-column:2}
.empty{padding:28px 18px;border:1px dashed var(--line);text-align:center;color:var(--ink-soft);background:var(--paper)}
.empty b{display:block;font-family:var(--display);font-size:20px;color:var(--ink);font-weight:600;margin-bottom:4px}

/* ---------- dialogues ---------- */
.dlg{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;align-items:start}
.bubbles{display:grid;gap:14px;max-width:640px}
.bub{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start}
.bub .who{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--ink);color:var(--sheet)}
.bub.b .who{background:var(--mustard);color:var(--spine)}
.bub .txt{background:var(--sheet);border:1px solid var(--line);padding:12px 16px;font-family:var(--display);font-size:20px;line-height:1.35}
.bub.b .txt{background:var(--paper)}
.bub .hidden{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;border:1.5px dashed var(--mustard);padding:12px 16px;color:var(--mustard-ink);font-weight:700;font-size:14px;background:var(--mustard-soft)}
.bub .hidden:focus-visible{outline:2px solid var(--ink)}
.dlg-note{font-size:14px;color:var(--ink-soft);border-left:3px solid var(--mustard);padding-left:12px;max-width:640px}
.mini-list{display:flex;flex-direction:column;gap:2px}
.mini-list button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;gap:8px;padding:9px 12px;font-size:14px;font-weight:600;color:var(--ink-soft);border-left:2px solid var(--line)}
.mini-list button[aria-current="true"]{color:var(--ink);border-left-color:var(--mustard);background:var(--paper)}
.mini-list button small{font-variant-numeric:tabular-nums;color:var(--ink-faint)}
.mini-list button:focus-visible{outline:2px solid var(--mustard)}

.foot{margin-top:28px;font-size:12.5px;color:var(--ink-soft);font-style:italic;font-family:var(--display)}

@media (max-width:980px){
  .today-grid{grid-template-columns:minmax(0,1fr)}
  .learn,.dlg{grid-template-columns:minmax(0,1fr)}
  .toc{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:6px}
  .toc button{flex:none;grid-template-columns:auto;border-left:0;border-bottom:2px solid var(--line)}
  .toc button .t{display:none}
  .toc button[aria-current="true"]{border-bottom-color:var(--mustard)}
  .mini-list{flex-direction:row;overflow-x:auto}
  .mini-list button{flex:none;border-left:0;border-bottom:2px solid var(--line)}
  .mini-list button[aria-current="true"]{border-bottom-color:var(--mustard)}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:auto 0 0 0;top:auto;height:auto;z-index:20;flex-direction:row;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:2px dashed rgba(246,238,219,.25)}
  .brand,.rail-foot,.nav .fr-l{display:none}
  .nav{flex-direction:column;gap:3px;padding:6px 8px;font-size:11px;border-radius:8px;flex:1}
  .nav[aria-current="page"]{box-shadow:inset 0 3px 0 var(--mustard)}
  .nav .lg{display:none}
  .nav.theme{margin-top:0;flex:0 0 64px}
  .nav .badge{position:absolute;top:2px;right:8px;margin:0}
  .desk{padding-block:22px 110px}
  .chap{grid-template-columns:minmax(0,1fr)}
  .fix{grid-template-columns:minmax(0,1fr);padding-left:36px}
  .fix .arrow{display:none}
  .stamp{width:64px;height:64px;font-size:12px;top:14px;right:14px}
}

/* ---------- giấy mềm (theo repo french-vocab-study) ---------- */
body{background:radial-gradient(circle at 18% 0%,var(--glow),transparent 32rem),var(--desk)}
.sheet,.qcard,.paper,.lcard,.tcard{border:0;border-radius:3px;box-shadow:var(--soft)}
.sheet.fold,.qcard{clip-path:none}
.sheet.fold::after,.qcard::after{content:"";position:absolute;top:0;right:0;width:42px;height:42px;background:linear-gradient(225deg,var(--desk) 49%,var(--corner) 50%);border-radius:0 3px 0 0;pointer-events:none}
.qcard{background-image:repeating-linear-gradient(to bottom,transparent 0 32px,var(--ruled) 33px 34px);background-position:0 70px}
.paper{background-image:repeating-linear-gradient(to bottom,transparent 0 28px,var(--ruled) 29px 30px)}
.side-stack .paper:nth-child(1){background-color:var(--s3);transform:rotate(-.6deg)}
.side-stack .paper:nth-child(2){background-color:var(--s1);transform:rotate(.5deg)}
.side-stack .paper:nth-child(3){background-color:var(--s4);transform:rotate(-.35deg)}
.side-stack .paper:nth-child(4){background-color:var(--s5);transform:rotate(.4deg)}
/* phiếu giấy rời: chủ điểm & bài học */
.lcard,.tcard{overflow:hidden;background-image:repeating-linear-gradient(to bottom,transparent 0 28px,var(--ruled) 29px 30px);transition:transform .19s var(--ease),box-shadow .19s var(--ease);padding-top:24px}
.lcard::before,.tcard::before{content:"";position:absolute;top:12px;right:-14px;width:68px;height:17px;background:var(--tapeA);transform:rotate(42deg)}
.lcard::after,.tcard::after{content:"";position:absolute;right:0;bottom:0;border-bottom:20px solid rgba(22,58,95,.1);border-left:20px solid transparent}
.lcard:hover,.tcard:hover{transform:translateY(-4px) rotate(-.5deg);box-shadow:var(--soft-hover)}
.topics>.tcard:nth-child(7n+1),.lessons>.lcard:nth-child(7n+1){background-color:var(--s1)}
.topics>.tcard:nth-child(7n+2),.lessons>.lcard:nth-child(7n+2){background-color:var(--s3);transform:rotate(.45deg);top:6px}
.topics>.tcard:nth-child(7n+3),.lessons>.lcard:nth-child(7n+3){background-color:var(--s4);transform:rotate(-.5deg);top:-3px}
.topics>.tcard:nth-child(7n+4),.lessons>.lcard:nth-child(7n+4){background-color:var(--s5);transform:rotate(-.25deg);top:4px}
.topics>.tcard:nth-child(7n+5),.lessons>.lcard:nth-child(7n+5){background-color:var(--s2);transform:rotate(.6deg);top:-5px}
.topics>.tcard:nth-child(7n+6),.lessons>.lcard:nth-child(7n+6){background-color:var(--s6);transform:rotate(-.35deg);top:6px}
.topics>.tcard:nth-child(7n+7),.lessons>.lcard:nth-child(7n+7){background-color:var(--s7);transform:rotate(.3deg)}
.topics>.tcard:nth-child(n):hover,.lessons>.lcard:nth-child(n):hover{transform:translateY(-4px) rotate(-.5deg)}
.topics,.lessons{gap:22px;padding:6px 4px 14px}
.lcard .prog,.tcard .mbar{background:var(--track);border:0;border-radius:2px}
.mbar,.prog,.qtop .bar{border-radius:999px;overflow:hidden}
.qtop .bar{border:0;background:var(--track);height:9px}
.qtop .bar i,.prog i{border-radius:999px}
/* nút & ô chọn mềm hơn */
.btn{border-radius:3px}
.btn.ghost{border:0;box-shadow:inset 0 0 0 1px var(--line);background:var(--sheet)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1px var(--ink)}
.seg{border:0;border-radius:3px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;background:var(--sheet)}
.seg button{border-left:1px solid var(--line)}
.opt{border-radius:3px;border:0;box-shadow:inset 0 0 0 1.5px var(--line)}
.opt:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.opt.ok{box-shadow:inset 0 0 0 2px var(--sage-ink)} .opt.no{box-shadow:inset 0 0 0 2px var(--coral)}
.verdict{border-radius:3px;border-width:0;box-shadow:inset 4px 0 0 currentColor}
.fb{border-radius:0 3px 3px 0}
.tape{box-shadow:2px 2px 0 rgba(136,99,11,.13)}
.words{border:0;border-radius:3px;overflow:hidden;box-shadow:var(--soft);gap:1px;background:var(--line)}
.w{border:0}
.chap{border-color:var(--line)}
.concept{border-radius:3px}
.step{border-radius:4px 4px 0 0}
.bub .txt{border:0;border-radius:3px 14px 14px 14px;box-shadow:var(--soft)}
.bub.b .txt{border-radius:14px 3px 14px 14px;background:var(--s1)}
.bub .hidden{border-radius:14px 3px 14px 14px}
.cal i{border:0;border-radius:3px;background:var(--track)}
/* gáy sổ: đường khâu */
.rail::after{content:"";position:absolute;top:14px;bottom:14px;right:9px;width:2px;opacity:.35;background:repeating-linear-gradient(to bottom,transparent 0 10px,rgba(238,244,241,.8) 10px 16px);pointer-events:none}
.rail{border-right:0}
.nav[aria-current="page"]{border-radius:10px 0 0 10px}
@media (prefers-reduced-motion:reduce){.lcard,.tcard{transition:none}.lcard:hover,.tcard:hover{transform:none}}
@media (max-width:820px){.topics>.tcard:nth-child(n),.lessons>.lcard:nth-child(n),.side-stack .paper:nth-child(n){transform:none;top:0}.rail::after{display:none}}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 22px}
.chipf{all:unset;box-sizing:border-box;cursor:pointer;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink-soft);background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line)}
.chipf small{font-weight:800;color:var(--ink-faint);margin-left:4px;font-variant-numeric:tabular-nums}
.chipf:hover{color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chipf[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.chipf[aria-pressed="true"] small{color:var(--mustard)}
.chipf:focus-visible{outline:2px solid var(--mustard);outline-offset:2px}
.lnav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 18px;margin-bottom:16px}
.pick{display:flex;align-items:center;gap:10px;min-width:0}
.pick select{font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--sheet);border:0;border-radius:3px;box-shadow:inset 0 0 0 1px var(--line);padding:8px 34px 8px 12px;max-width:min(440px,70vw);appearance:none;-webkit-appearance:none;cursor:pointer;
 background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.pick select:focus-visible{outline:2px solid var(--mustard)}

/* ô điền đáp án: phiếu giấy */
.qcard input[type=text]{font-family:var(--display);font-size:clamp(22px,2.6vw,28px);font-weight:600;letter-spacing:-.01em;color:var(--ink);
  background:var(--paper);border:0;border-radius:10px;padding:16px 20px;width:100%;
  box-shadow:inset 0 0 0 1.5px var(--line),inset 0 2px 6px rgba(22,58,95,.06);transition:box-shadow .16s var(--ease),background .16s var(--ease);
  text-decoration:none;caret-color:var(--mustard)}
.qcard input[type=text]::placeholder{font-family:var(--body);font-style:normal;font-weight:500;font-size:16px;color:var(--ink-faint)}
.qcard input[type=text]:hover{box-shadow:inset 0 0 0 1.5px var(--ink-faint),inset 0 2px 6px rgba(22,58,95,.06)}
.qcard input[type=text]:focus{outline:none;background:var(--sheet);box-shadow:inset 0 0 0 2px var(--mustard),0 0 0 5px color-mix(in srgb,var(--mustard) 22%,transparent)}
.qcard input.is-ok{background:var(--sage);color:var(--sage-ink);box-shadow:inset 0 0 0 2px var(--sage-ink);text-decoration:none}
.qcard input.is-accent{background:var(--mustard-soft);color:var(--mustard-ink);box-shadow:inset 0 0 0 2px var(--mustard)}
.qcard input.is-no{background:var(--coral-soft);color:var(--coral);box-shadow:inset 0 0 0 2px var(--coral);text-decoration:line-through;text-decoration-thickness:2px}
.qcard input:disabled{opacity:1;-webkit-text-fill-color:currentColor}
.qacts .btn{border-radius:10px;min-height:52px}
.qacts .btn.mid,.qacts .btn.bad,.qacts .btn.ghost{box-shadow:inset 0 0 0 1.5px currentColor;border:0;background:var(--sheet)}
.qacts .btn.mid{color:var(--mustard-ink)}
.qacts .btn.ghost{color:var(--ink-soft);box-shadow:inset 0 0 0 1.5px var(--line)}
.qacts .btn.ghost:hover{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.verdict{border-radius:10px}

/* chữ tiếng Pháp luôn dùng Fraunces như repo */
.fr{font-family:var(--display);font-weight:600;letter-spacing:-.01em;font-size:1.06em}
.opt span{font-family:var(--display);font-weight:600;font-size:18px}
.qcard input[type=text]{font-family:var(--display);font-weight:600;font-optical-sizing:auto}
.qcard input[type=text]::placeholder{font-family:var(--display);font-style:italic;font-weight:400;font-size:19px}
.verdict .fr{font-size:1.1em}
.bub .txt .fr,.w .fr{font-size:inherit}

/* ô điền từ theo repo: nhãn nhỏ + gạch chân đứt màu mù tạt */
.ans-field{display:block;margin-top:6px}
.ans-field>span{display:block;color:var(--ink-soft);font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.qcard .ans-field input[type=text]{display:block;width:100%;margin-top:8px;padding:10px 0 12px;border:0;border-radius:0;background:transparent;box-shadow:none;
  border-bottom:2px dashed var(--mustard);font-family:var(--display);font-size:clamp(24px,2.6vw,30px);font-weight:600;letter-spacing:-.02em;color:var(--ink);caret-color:var(--mustard);text-decoration:none}
.qcard .ans-field input[type=text]::placeholder{font-family:var(--body);font-style:normal;font-size:14px;font-weight:600;color:var(--ink-faint);letter-spacing:0}

 links:[["Buổi 8","https://www.canva.com/d/QZqIASx6izmOT0r"]],
 notes:[
  {k:1,h:"1 · Hỏi giờ",html:`<ul>
  <li>${F("Quelle heure est-il ?")} lịch sự, chuẩn</li>
  <li>${F("Il est quelle heure ?")} nói thường</li>
  <li>${F("Vous avez l'heure, s'il vous plaît ?")} hỏi người lạ</li>
  <li>${F("Tu as l'heure ?")} hỏi bạn bè</li></ul>
  <p>Trả lời luôn bắt đầu bằng <b>${F("Il est…")}</b>: ${F("Il est neuf heures.")}</p>
  <p class="tip">Giờ dùng <b>il</b> giả (giống il fait beau), không dùng c'est.</p>`},
  {k:1,h:"2 · heure là danh từ GIỐNG CÁI",html:`<div class="tbl"><table>
  <tr><td>1h</td><td>${F("une heure")}</td><td>không phải <s>un heure</s></td></tr>
  <tr><td>2h</td><td>${F("deux heures")}</td><td>số nhiều thêm -s</td></tr>
  <tr><td>21h</td><td>${F("vingt et une heures")}</td><td>un → une vì heure giống cái</td></tr>
  <tr><td>0h / 12h</td><td>${F("minuit")} / ${F("midi")}</td><td>không thêm heures</td></tr></table></div>
  <p class="tip">Nối âm với heures: ${F("deux heures")} /dø.zœʁ/, ${F("trois heures")} /tʁwa.zœʁ/, ${F("six heures")} /si.zœʁ/, ${F("neuf heures")} /nœ.vœʁ/ (f → v).</p>`},
  {k:1,h:"3 · Cách nói thường (đồng hồ 12h)",html:`<p>Từ phút 1 đến 30: <b>giờ + (et) phút</b>. Từ phút 31: <b>giờ SAU + moins + số phút còn thiếu</b>.</p>
  <div class="tbl"><table>
  <tr><th>Giờ</th><th>Cách nói</th><th>Ghi chú</th></tr>
  <tr><td>9h05</td><td>${F("neuf heures cinq")}</td><td>không cần et</td></tr>
  <tr><td>9h15</td><td>${F("neuf heures et quart")}</td><td>quart = 1/4, có <b>et</b></td></tr>
  <tr><td>9h20</td><td>${F("neuf heures vingt")}</td><td></td></tr>
  <tr><td>9h30</td><td>${F("neuf heures et demie")}</td><td>demie = 1/2, có <b>et</b></td></tr>
  <tr><td>9h40</td><td>${F("dix heures moins vingt")}</td><td>kém 20 → giờ sau</td></tr>
  <tr><td>9h45</td><td>${F("dix heures moins le quart")}</td><td>có <b>le</b>: moins <b>le</b> quart</td></tr>
  <tr><td>9h55</td><td>${F("dix heures moins cinq")}</td><td></td></tr>
  <tr><td>12h30</td><td>${F("midi et demi")} / ${F("midi et demie")}</td><td>sách ngữ pháp: <b>demi</b> (hợp với midi giống đực); người Pháp cũng hay viết <b>demie</b> (ngầm hiểu “heure”), cả hai đều được chấp nhận</td></tr>
  <tr><td>0h15</td><td>${F("minuit et quart")}</td><td></td></tr></table></div>
  <p class="tip">Phân biệt buổi: ${F("du matin")} (sáng) · ${F("de l'après-midi")} (chiều) · ${F("du soir")} (tối). 8h tối = ${F("huit heures du soir")}. Chú ý: ${F("une heure et demie")} (heure cái → demi<b>e</b>) ≠ ${F("midi et demi")}.</p>`},
  {k:1,h:"4 · Cách nói chính thức (đồng hồ 24h)",html:`<p>Dùng cho tàu xe, lịch làm việc, giờ mở cửa, đài TV. Luôn <b>giờ + số phút</b>, không dùng quart, demie, moins:</p>
  <div class="tbl"><table>
  <tr><td>16h20</td><td>${F("seize heures vingt")}</td></tr>
  <tr><td>18h45</td><td>${F("dix-huit heures quarante-cinq")}</td><td>= ${F("sept heures moins le quart du soir")}</td></tr>
  <tr><td>13h30</td><td>${F("treize heures trente")}</td><td>= ${F("une heure et demie de l'après-midi")}</td></tr>
  <tr><td>23h50</td><td>${F("vingt-trois heures cinquante")}</td><td>= ${F("minuit moins dix")}</td></tr></table></div>
  <p class="tip">Viết tắt: 16h20 hoặc 16 h 20 (không dùng dấu hai chấm như tiếng Anh).</p>`},
  {k:1,h:"5 · Giới từ đi với giờ",html:`<div class="tbl"><table>
  <tr><td>${F("à")}</td><td>lúc</td><td>${F("Le cours commence à dix heures.")}</td></tr>
  <tr><td>${F("À quelle heure ?")}</td><td>lúc mấy giờ?</td><td>${F("Tu veux apprendre à quelle heure ?")}</td></tr>
  <tr><td>${F("vers")}</td><td>khoảng, tầm</td><td>${F("J'arrive vers huit heures.")}</td></tr>
  <tr><td>${F("de… à…")}</td><td>từ… đến…</td><td>${F("Je travaille de neuf heures à dix-huit heures.")}</td></tr>
  <tr><td>${F("jusqu'à")}</td><td>cho đến</td><td>${F("La boutique est ouverte jusqu'à vingt heures.")}</td></tr>
  <tr><td>${F("à partir de")}</td><td>kể từ</td><td>${F("Je suis libre à partir de dix-neuf heures.")}</td></tr>
  <tr><td>${F("avant / après")}</td><td>trước / sau</td><td>${F("avant midi")}, ${F("après le dîner")}</td></tr>
  <tr><td>${F("pendant")}</td><td>trong suốt</td><td>${F("pendant une heure")}</td></tr></table></div>
  <p class="tip">${F("à cette heure")} = vào giờ đó (câu của em: ${F("Je vais dormir à cette heure.")})</p>`},
  {h:"6 · Đúng giờ, sớm, muộn",html:`<ul>
  <li>${F("être à l'heure")} đúng giờ</li>
  <li>${F("être en avance")} đến sớm · ${F("être en retard")} bị muộn</li>
  <li>${F("Il est tôt.")} còn sớm · ${F("Il est tard.")} muộn rồi</li>
  <li>${F("pile")} / ${F("précises")}: ${F("à huit heures pile")} = đúng 8 giờ</li>
  <li>${F("une demi-heure")} nửa tiếng · ${F("un quart d'heure")} 15 phút · ${F("une heure et demie")} 1 tiếng rưỡi</li>
  <li>${F("une minute")}, ${F("une seconde")}, ${F("un instant")}</li></ul>`},
  {k:1,h:"7 · Nói ngày tháng",html:`<p>Hỏi: ${F("On est le combien aujourd'hui ?")} · ${F("Quelle est la date aujourd'hui ?")} · ${F("On est quel jour ?")}</p>
  <p>Trả lời: <b>${F("On est le…")}</b> / <b>${F("Nous sommes le…")}</b> + thứ + số + tháng + năm</p>
  <ul><li>${F("Aujourd'hui, on est le premier octobre.")} ngày 1 dùng <b>premier</b></li>
  <li>${F("On est le deux octobre.")} các ngày khác dùng số đếm (không dùng deuxième)</li>
  <li>${F("Nous sommes jeudi, le premier octobre deux mille vingt-six.")}</li></ul>
  <p class="tip">Tháng: ${F("en octobre")} = ${F("au mois d'octobre")} (vào tháng 10). Năm: ${F("en deux mille vingt-six")}. Thứ, tháng không viết hoa. Không dùng mạo từ trước tên tháng: ${F("la dernière semaine d'octobre")}.</p>`},
  {k:1,h:"8 · le + thứ: thói quen hay lần này?",html:`<div class="tbl"><table>
  <tr><td>${F("le jeudi")}</td><td><b>mỗi</b> thứ Năm (lặp lại)</td><td>${F("On se retrouve le jeudi.")}</td></tr>
  <tr><td>${F("jeudi")}</td><td>thứ Năm <b>này</b> (một lần)</td><td>${F("On se retrouve jeudi.")}</td></tr>
  <tr><td>${F("ce jeudi")}</td><td>thứ Năm tuần này</td><td>${F("Ce jeudi, je ne peux pas enseigner.")}</td></tr>
  <tr><td>${F("jeudi prochain")}</td><td>thứ Năm tới</td><td></td></tr>
  <tr><td>${F("jeudi dernier")}</td><td>thứ Năm vừa rồi</td><td></td></tr>
  <tr><td>${F("tous les jeudis")}</td><td>tất cả các thứ Năm</td><td>= le jeudi</td></tr></table></div>`},
  {k:1,h:"9 · Mốc thời gian: trước, nay, sau",html:`<div class="tbl"><table>
  <tr><th>Quá khứ</th><th>Hiện tại</th><th>Tương lai</th></tr>
  <tr><td>${F("hier")}</td><td>${F("aujourd'hui")}</td><td>${F("demain")}</td></tr>
  <tr><td>${F("avant-hier")}</td><td></td><td>${F("après-demain")}</td></tr>
  <tr><td>${F("hier soir")}</td><td>${F("ce matin")}, ${F("cet après-midi")}, ${F("ce soir")}</td><td>${F("demain matin")}</td></tr>
  <tr><td>${F("la semaine dernière")}</td><td>${F("cette semaine")}</td><td>${F("la semaine prochaine")}</td></tr>
  <tr><td>${F("le mois dernier")}</td><td>${F("ce mois-ci")}</td><td>${F("le mois prochain")}</td></tr>
  <tr><td>${F("l'année dernière")}</td><td>${F("cette année")}</td><td>${F("l'année prochaine")}</td></tr></table></div>
  <p class="tip"><b>dernier</b> đứng SAU danh từ = vừa qua: ${F("la semaine dernière")} (tuần trước). Đứng TRƯỚC = cuối cùng: ${F("la dernière semaine")} (tuần cuối). ce / cet / cette theo giống: ${F("cet après-midi")} (après-midi bắt đầu bằng nguyên âm).</p>`},
  {h:"10 · Tần suất & khoảng thời gian",html:`<ul>
  <li>${F("tous les jours")} mỗi ngày · ${F("toutes les semaines")} mỗi tuần · ${F("tous les matins")} mỗi sáng</li>
  <li>${F("le matin")}, ${F("le soir")} = vào các buổi sáng / tối (thói quen): ${F("J'aime travailler le soir.")}</li>
  <li>${F("une fois par semaine")} một lần một tuần · ${F("deux fois par jour")}</li>
  <li>${F("dans deux heures")} hai tiếng nữa · ${F("il y a deux heures")} cách đây hai tiếng</li></ul>`},
  {h:"11 · pouvoir (có thể) & vouloir (muốn)",html:`<div class="tbl"><table>
  <tr><th></th><th>pouvoir</th><th>vouloir</th></tr>
  <tr><td>je</td><td>${F("peux")}</td><td>${F("veux")}</td></tr>
  <tr><td>tu</td><td>${F("peux")}</td><td>${F("veux")}</td></tr>
  <tr><td>il / on</td><td>${F("peut")}</td><td>${F("veut")}</td></tr>
  <tr><td>nous</td><td>${F("pouvons")}</td><td>${F("voulons")}</td></tr>
  <tr><td>vous</td><td>${F("pouvez")}</td><td>${F("voulez")}</td></tr>
  <tr><td>ils</td><td>${F("peuvent")}</td><td>${F("veulent")}</td></tr></table></div>
  <p>Theo sau là động từ nguyên thể: ${F("Je peux étudier à dix heures du soir.")} ${F("Je ne veux pas travailler.")}</p>
  <p class="tip">${F("Je voudrais")} = I'd like (lịch sự). Đảo ngữ với je: ${F("Puis-je rester chez moi ?")} (không nói <s>peux-je</s>).</p>`},
  {h:"12 · Rủ rê & hẹn giờ",html:`<ul>
  <li>Rủ: ${F("On peut se retrouver quand ?")} ${F("Dimanche à huit heures, ça te dit ?")} ${F("Tu es libre samedi ?")}</li>
  <li>Đổi lịch: ${F("On peut avoir le cours ce dimanche soir ?")}</li>
  <li>Đồng ý: ${F("D'accord.")} ${F("Ça me va.")} ${F("Avec plaisir !")}</li>
  <li>Từ chối: ${F("Je suis désolée, je ne peux pas.")} ${F("Zut !")} (tiếc ghê / chết thật)</li>
  <li>Đề xuất giờ khác: ${F("Alors, tu veux apprendre à quelle heure ?")}</li>
  <li>Kết thúc: ${F("Bonne soirée, Madame !")}</li></ul>`},
  {h:"13 · La journée de Loan",html:`<p>${F("Je me réveille à six heures et demie.")} ${F("Je me brosse les dents.")} ${F("À sept heures et demie, je vais au travail.")} ${F("À huit heures, j'arrive au bureau et je commence à travailler.")} ${F("Je participe aux réunions avec mes collègues.")} ${F("À dix-neuf heures, je suis à la maison.")} ${F("Je dîne.")} ${F("Je me lave.")} ${F("À vingt et une heures, j'apprends le français.")} ${F("À vingt-trois heures, je continue mon travail chez moi.")} ${F("J'aime travailler le soir.")}</p>
  <p class="tip">aux = à + les. commencer <b>à</b> + V. Động từ phản thân giữ đại từ: je <b>me</b> lave, tu <b>te</b> laves.</p>`}
 ],

 id:"b7", date:"19/09", name:"Futur proche, adjectifs, ce/cet/cette", src:"Buổi 7 + BTVN sau buổi 7",
 links:[["Buổi 7","https://www.canva.com/d/ZrfmQWCIRmuddgw"],["BTVN sau buổi 7","https://www.canva.com/d/A8NV7g6h-VfnW1J"]],
 notes:[
  {k:1,h:"Tương lai gần: aller + V nguyên thể",html:`<p>aller: ${F("vais, vas, va, allons, allez, vont")}</p>
  <p>${F("Je vais finir les devoirs ce soir.")} ${F("Les devoirs vont être difficiles.")}</p>
  <p>Hỏi: ${F("Qu'est-ce qu'on va manger ce soir ?")} = ${F("On va manger quoi ce soir ?")} = ${F("Que va-t-il étudier ?")}</p>`},
  {k:1,h:"Quá khứ gần: venir de + V nguyên thể (vừa mới)",html:`<p>venir: ${F("viens, viens, vient, venons, venez, viennent")}</p>
  <p>${F("Je viens de finir les devoirs.")} ${F("Ils viennent de regarder une série.")} Trước nguyên âm: ${F("Il vient d'aller au cours.")}</p>`},
  {h:"Tính từ: hợp giống & số",html:`<ul>
  <li>Giống cái +e, số nhiều +s: ${F("grand → grande → grands → grandes")}</li>
  <li>${F("blanc → blanche")}, ${F("long → longue")}, ${F("léger → légère")}, ${F("cher → chère")}</li>
  <li>${F("beau → belle, beaux, belles")}. Trước danh từ đực bắt đầu bằng nguyên âm: ${F("un bel homme")}, ${F("un bel ami")}</li>
  <li>Tương tự: ${F("nouveau → nouvelle")} (${F("un nouvel ami")}), ${F("vieux → vieille")}</li></ul>`},
  {h:"Tính từ: vị trí",html:`<p><b>95% đứng SAU</b> danh từ: ${F("un chien intelligent")}, ${F("une robe noire")}</p>
  <p><b>Đứng TRƯỚC</b> (nhớ "BAGS"):</p><ul>
  <li><b>B</b>eauty: beau, joli</li><li><b>A</b>ge: jeune, vieux, nouveau</li>
  <li><b>G</b>oodness: bon, mauvais</li><li><b>S</b>ize: petit, grand</li></ul>
  <p class="tip">${F("un grand chien")} · ${F("une petite enceinte")} · ${F("une bonne idée")}. Tính từ đứng trước danh từ thì nối âm: ${F("un petit ami")}.</p>`},
  {k:1,h:"Tính từ chỉ định (this / these)",html:`<div class="tbl"><table>
  <tr><td>${F("ce")}</td><td>N đực số ít</td><td>${F("ce sac à dos")}</td></tr>
  <tr><td>${F("cet")}</td><td>N đực số ít, bắt đầu bằng nguyên âm hoặc h câm</td><td>${F("cet étui")}, ${F("cet ami")}</td></tr>
  <tr><td>${F("cette")}</td><td>N cái số ít</td><td>${F("cette coque")}</td></tr>
  <tr><td>${F("ces")}</td><td>số nhiều</td><td>${F("ces robes")}</td></tr></table></div>
  <p class="tip">Không có "cettes". <b>ces</b> (này) ≠ <b>ses</b> (của anh ấy/cô ấy), đọc giống nhau. Thêm -ci / -là: ${F("cet ami-là")}</p>`},
  {h:"dormir · sortir · partir (đuôi -ir, nhóm 3)",html:`<p>Số ít bỏ 3 chữ cuối, thêm -s, -s, -t. Số nhiều giữ phụ âm.</p><div class="tbl"><table>
  <tr><th></th><th>dormir (ngủ)</th><th>sortir (ra ngoài)</th><th>partir (rời đi)</th></tr>
  <tr><td>je</td><td>dors</td><td>sors</td><td>pars</td></tr>
  <tr><td>tu</td><td>dors</td><td>sors</td><td>pars</td></tr>
  <tr><td>il</td><td>dort</td><td>sort</td><td>part</td></tr>
  <tr><td>nous</td><td>dormons</td><td>sortons</td><td>partons</td></tr>
  <tr><td>vous</td><td>dormez</td><td>sortez</td><td>partez</td></tr>
  <tr><td>ils</td><td>dorment</td><td>sortent</td><td>partent</td></tr></table></div>`},
  {h:"Quần áo",html:`<p>${F("une robe")} · ${F("une jupe")} · ${F("un pantalon")} · ${F("un jean")} · ${F("une chemise")} · ${F("une cravate")} · ${F("un pull")} · ${F("un costume")} · ${F("une veste en jean")} · ${F("un manteau")} · ${F("des bottes")} · ${F("un chapeau")} · ${F("une ceinture")} · ${F("des lunettes de soleil")} · ${F("un sac à main")} · ${F("des bijoux")}</p>
  <p class="tip">${F("en coton")}, ${F("en cuir")}, ${F("en lin")} (chất liệu). ${F("d'occasion")} = đồ cũ. ${F("Vous faites quelle taille ?")} ${F("Je fais du 38.")}</p>`},
  {h:"Đồ vật & công dụng",html:`<p>${F("Ça sert à quoi ?")} trả lời bằng ${F("Ça sert à téléphoner / à se repérer / à numériser des documents.")}</p>
  <p>${F("une montre connectée")} · ${F("une enceinte")} · ${F("des écouteurs sans fil")} · ${F("une tablette")} · ${F("une batterie externe")} · ${F("une coque de téléphone")} · ${F("un étui")} · ${F("un cadre photo")} · ${F("un cadeau")} · ${F("une cagnotte")}</p>
  <p class="tip">Hình dạng: ${F("carré, rond, rectangulaire")}. ${F("lourd")} ≠ ${F("léger")}.</p>`}

 links:[["Tuần 6","https://www.canva.com/d/wWfIFwXHHFqApMq"],["BTVN sau buổi 6","https://www.canva.com/d/fWY-qbOr3ZyMrLt"]],
 notes:[
  {k:1,h:"Động từ nhóm 2 (-ir, có -iss-)",html:`<p>finir: ${F("finis, finis, finit, finissons, finissez, finissent")}</p>
  <p>Cùng nhóm: ${F("choisir")}, ${F("grandir")}, ${F("réussir")}, ${F("réfléchir")}, ${F("réunir")}</p>
  <p class="tip">Mẹo: số nhiều chèn thêm <b>-iss-</b>. ${F("Je grandis à Hanoï.")} ${F("Nous choisissons.")}</p>`},
  {h:"prendre & descendre",html:`<p>prendre: ${F("prends, prends, prend, prenons, prenez, prennent")}</p>
  <p>descendre: ${F("descends, descends, descend, descendons, descendez, descendent")}</p>
  <p class="tip">apprendre, comprendre chia giống prendre. ${F("prendre le bus")} = đi xe buýt.</p>`},
  {k:1,h:"Câu mệnh lệnh (Impératif)",html:`<p>Bỏ chủ ngữ, chỉ có 3 ngôi tu / nous / vous.</p>
  <ul><li>${F("Vous mangez ce pain.")} → ${F("Mangez ce pain !")}</li>
  <li>${F("Nous prenons le bus.")} → ${F("Prenons le bus !")}</li>
  <li>Động từ -er (và aller) ở ngôi tu <b>bỏ -s</b>: ${F("Mange !")} ${F("Regarde le plan !")} ${F("Va à l'école !")}</li>
  <li>Động từ khác giữ nguyên -s: ${F("Finis tes exercices !")} ${F("Prends le métro !")}</li>
  <li>être: ${F("Sois calme ! Soyons… Soyez calme !")} · avoir: ${F("aie, ayons, ayez")}</li></ul>`},
  {h:"Chỉ đường",html:`<ul>
  <li>${F("Continuez tout droit jusqu'au carrefour.")} đi thẳng đến ngã tư</li>
  <li>${F("Tournez à gauche / à droite.")}</li>
  <li>${F("Prenez la deuxième rue à gauche.")}</li>
  <li>${F("Traversez le pont.")}</li>
  <li>${F("C'est là, à votre droite.")}</li></ul>
  <p class="tip">${F("une mairie")}, ${F("un pont")}, ${F("un bâtiment")}, ${F("une avenue")}, ${F("un boulevard")}. ${F("une bibliothèque")} = thư viện ≠ ${F("une librairie")} = hiệu sách</p>`},
  {h:"Phương tiện",html:`<p>Ngồi <b>trong</b> xe: <b>en</b> ${F("en bus, en métro, en voiture, en scooter, en tram")}</p>
  <p>Ngồi/đứng <b>trên</b>, đi bộ: <b>à</b> ${F("à pied, à vélo, à trottinette")}</p>
  <p class="tip">${F("le covoiturage")} = đi chung xe. ${F("les heures de pointe")} = giờ cao điểm.</p>`},
  {h:"Trạng từ tần suất (đứng SAU động từ)",html:`<p>${F("toujours")} › ${F("souvent")} › ${F("parfois")} › ${F("rarement")} › ${F("ne… jamais")}</p>
  <p>${F("Je vais souvent au travail en scooter.")}<br>${F("Je ne vais jamais au théâtre.")}</p>`},
  {h:"Từ nối (connecteurs)",html:`<p>${F("et")} · ${F("mais")} · ${F("parce que")} (${F("parce qu'")} trước nguyên âm) · ${F("pour")} + V/N · ${F("avec")} · ${F("sans")} · ${F("alors")} · ${F("donc")}</p>
  <p>${F("J'aime Lyon parce que c'est dynamique.")}</p>`},
  {h:"Nối âm (liaison)",html:`<ul><li><b>Bắt buộc</b>: mạo từ + N ${F("les amis")}, đại từ + V ${F("nous avons")}, tính từ + N ${F("un petit ami")}</li>
  <li><b>Tùy</b>: sau động từ, ví dụ ${F("je suis allé")}</li>
  <li><b>Cấm</b>: sau "et": ${F("et un")} không nối</li></ul>
  <p class="tip">Khi nối, s/x đọc thành /z/, d thành /t/, f thành /v/: ${F("neuf heures")}</p>`}
 ],

  <p>${F("Je fais les courses.")} = đi chợ. ${F("Je vais au supermarché pour faire mes courses.")}</p>`},

  <tr><td>${F("à la maison")}</td><td>${F("chez moi")}, ${F("chez Pepe")}</td></tr></table></div>
  <p class="tip">à + le = <b>au</b> (${F("au marché")}) · à + les = <b>aux</b> (${F("aux caisses automatiques")})</p>`},
  {k:1,h:"Mạo từ bộ phận: một ít, không đếm được",html:`<ul><li>${F("du")} + N đực: ${F("du pain, du lait, du poulet")}</li>
  <li>${F("de la")} + N cái: ${F("de la viande, de la farine")}</li>
  <li>${F("de l'")} + nguyên âm: ${F("de l'eau")}</li>
  <li>${F("des")} + số nhiều: ${F("des pâtes")}</li></ul>
  <p class="tip">${F("Je mange du pain")} (ăn bánh mì nói chung) ≠ ${F("Je mange un pain")} (một ổ)</p>`},
  {k:1,h:"Khi nào chỉ dùng DE",html:`<ul><li>Sau từ chỉ số lượng: ${F("un kilo de pommes")}, ${F("un peu de café")}, ${F("beaucoup de")}</li>
  <li>Trong câu phủ định: ${F("Je mange du pain")} → ${F("Je ne mange pas de pain.")}</li></ul>`},
  {h:"Đi chợ",html:`<ul><li>${F("Vous désirez ?")} bạn cần gì?</li>
  <li>${F("Je voudrais un kilo de pommes.")}</li>
  <li>${F("Vous avez des pêches ?")}</li>

  <li>${F("Je paie par carte / en espèces.")}</li></ul>

  {h:"Cửa hàng & người bán",html:`<div class="tbl"><table>

  <tr><th></th><th>đực</th><th>cái</th><th>nhiều</th></tr>
  <tr><td>của tôi</td><td>${F("mon")}</td><td>${F("ma")}</td><td>${F("mes")}</td></tr>
  <tr><td>của bạn</td><td>${F("ton")}</td><td>${F("ta")}</td><td>${F("tes")}</td></tr>
  <tr><td>của anh/cô ấy</td><td>${F("son")}</td><td>${F("sa")}</td><td>${F("ses")}</td></tr>
  <tr><td>của chúng tôi</td><td colspan="2">${F("notre")}</td><td>${F("nos")}</td></tr>
  <tr><td>của các bạn</td><td colspan="2">${F("votre")}</td><td>${F("vos")}</td></tr>
  <tr><td>của họ</td><td colspan="2">${F("leur")}</td><td>${F("leurs")}</td></tr></table></div>
  <p class="tip">Chia theo <b>vật được sở hữu</b>, không theo người sở hữu: ${F("sa sœur")} = chị của anh ấy. Trước nguyên âm thì ma đổi thành mon: ${F("mon amie")}</p>`},
  {h:"Đại từ nhấn mạnh",html:`<p>${F("moi, toi, lui, elle, nous, vous, eux, elles")}</p>

  {k:1,h:"Phủ định: ne … pas + de",html:`<p>un / une / des → <b>de</b> trong câu phủ định:</p>
  <p>${F("J'ai des sœurs.")} → ${F("Je n'ai pas de sœurs.")}<br>${F("Je n'ai pas de frère.")} ${F("Je suis fille unique.")}</p>`},
  {h:"Gia đình",html:`<p>${F("le père")} · ${F("la mère")} · ${F("les parents")} · ${F("le frère")} · ${F("la sœur")} · ${F("le fils")} · ${F("la fille")} · ${F("l'oncle")} · ${F("la tante")} · ${F("le neveu")} · ${F("la nièce")} · ${F("les grands-parents")} · ${F("le mari")} · ${F("la femme")}</p>
  <p>Gọi thân mật: ${F("papa, maman, papi, mamie")}</p>
  <p class="tip">Tình trạng: ${F("célibataire")}, ${F("marié(e)")}, ${F("divorcé(e)")}, ${F("pacsé(e)")}. ${F("petit ami / petite amie")} = người yêu</p>`},
  {h:"habiter à / dans",html:`<p>${F("J'habite à Nice.")} à + thành phố<br>${F("J'habite dans un quartier sympa.")} dans + khu vực cụ thể</p>
  <p class="tip">${F("en allemand")} = bằng tiếng Đức. ${F("commencer à")} + V. ${F("le chat de Pepe")}: de chỉ sở hữu.</p>`},
  {h:"Gộp mạo từ",html:`<p>à + le = ${F("au")} · à + les = ${F("aux")} · de + le = ${F("du")} · de + les = ${F("des")}</p><p class="tip">à la, à l', de la, de l' giữ nguyên.</p>`}

  {k:1,h:"Câu hỏi đóng (Oui / Non): 3 cách",html:`<ol><li>Giữ nguyên câu, lên giọng: ${F("Tu es vietnamienne ?")}</li>

  <li>Đảo ngữ, có gạch nối: ${F("Es-tu vietnamienne ?")} ${F("Aimez-vous le croissant ?")}</li></ol>`},
  {k:1,h:"Câu hỏi mở: 3 cách",html:`<ol><li>${F("Tu habites où ?")}</li><li>${F("Où est-ce que tu habites ?")}</li><li>${F("Où habites-tu ?")}</li></ol>

  {h:"Từ để hỏi",html:`<p>${F("qui")} ai · ${F("quand")} khi nào · ${F("où")} ở đâu · ${F("pourquoi")} tại sao · ${F("comment")} thế nào · ${F("combien")} bao nhiêu · ${F("quel")} cái nào</p>
  <p><b>"What"</b>: đứng đầu câu dùng <b>Que</b>, đứng sau động từ hoặc đứng một mình dùng <b>quoi</b>:<br>${F("Tu achètes quoi ?")} = ${F("Qu'est-ce que tu achètes ?")} = ${F("Qu'achètes-tu ?")}</p>`},
  {h:"quel / quelle / quels / quelles",html:`<p>Hợp theo danh từ đi sau:</p><p>${F("Quel âge as-tu ?")} · ${F("Quelle est ton adresse ?")} · ${F("Quels sports tu aimes ?")} · ${F("Tu parles quelles langues ?")}</p>`},

  <tr><td>${F("aux")}</td><td>nước số nhiều</td><td>${F("aux États-Unis")}</td></tr></table></div>

  {h:"C'est / Il y a",html:`<p>${F("C'est")} (= ce est) it is · ${F("Ce sont")} they are · ${F("Il y a")} there is / there are</p>

{
 id:"b2", date:"13/08", name:"Les verbes & se présenter", src:"Buổi 2 + BTVN sau buổi 2",
 links:[["Buổi 2","https://www.canva.com/d/kvH6x57dx1-_ghM"],["BTVN sau buổi 2","https://www.canva.com/d/uDCDNyVoONPr-BO"]],
 notes:[
  {h:"3 nhóm động từ",html:`<p>Nhóm 1: đuôi <b>-er</b> (parler) · Nhóm 2: <b>-ir</b> có -iss- (finir) · Nhóm 3: bất quy tắc (être, avoir, aller, prendre…)</p>`},
  {k:1,h:"Chia động từ -er",html:`<p>Bỏ -er, thêm: <b>-e, -es, -e, -ons, -ez, -ent</b></p>
  <p>${F("je parle, tu parles, il parle, nous parlons, vous parlez, ils parlent")}</p>
  <p class="tip">-e / -es / -ent đều câm nên parle, parles, parlent đọc giống nhau. Trước nguyên âm: ${F("j'aime")}, ${F("j'habite")}</p>`},
  {h:"Biến đổi đặc biệt (*)",html:`<ul><li>g → ge: ${F("nous mangeons")} · c → ç: ${F("nous commençons")}</li>
  <li>e/é → è: ${F("j'achète")}, ${F("je préfère")}, ${F("j'espère")}</li>
  <li>gấp đôi phụ âm: ${F("j'appelle")}, ${F("je jette")}</li>
  <li>y → i: ${F("je paie")}, ${F("j'essaie")}, ${F("j'envoie")}, ${F("je nettoie")}</li></ul>
  <p class="tip">Các biến đổi è / ll / tt / i không áp dụng cho nous, vous: ${F("nous achetons")}, ${F("nous appelons")}</p>`},
  {k:1,h:"Động từ phản thân",html:`<p>${F("me, te, se, nous, vous, se")}</p>
  <p>${F("Je me lève à 7h.")} ${F("Nous nous levons à 7h.")} ${F("Je m'appelle Loan.")} ${F("Vous vous appelez comment ?")}</p>
  <p class="tip">${F("lever")} = nâng lên ≠ ${F("se lever")} = thức dậy</p>`},
  {k:1,h:"être & avoir",html:`<div class="tbl"><table><tr><th></th><th>être</th><th>avoir</th></tr>
  <tr><td>je</td><td>${F("suis")}</td><td>${F("ai")}</td></tr><tr><td>tu</td><td>${F("es")}</td><td>${F("as")}</td></tr>
  <tr><td>il</td><td>${F("est")}</td><td>${F("a")}</td></tr><tr><td>nous</td><td>${F("sommes")}</td><td>${F("avons")}</td></tr>
  <tr><td>vous</td><td>${F("êtes")}</td><td>${F("avez")}</td></tr><tr><td>ils</td><td>${F("sont")}</td><td>${F("ont")}</td></tr></table></div>
  <p class="tip">Tuổi dùng <b>avoir</b>: ${F("J'ai dix-huit ans.")}</p>`},
  {h:"Mạo từ",html:`<p>Xác định: ${F("le")} (đực) · ${F("la")} (cái) · ${F("l'")} (nguyên âm, h câm) · ${F("les")} (nhiều)</p>
  <p>Không xác định: ${F("un")} · ${F("une")} · ${F("des")}</p>
  <p class="tip">ils / elles: chỉ cần có một nam trong nhóm là dùng <b>ils</b>.</p>`},
  {h:"Quốc tịch",html:`<p>${F("vietnamien / vietnamienne")} · ${F("japonais / japonaise")} · ${F("français / française")} · ${F("italien / italienne")} · ${F("chinois / chinoise")} · ${F("allemand / allemande")} · ${F("américain / américaine")}</p>`},
  {h:"Mẫu tự giới thiệu",html:`<p>${F("Salut, je m'appelle Loan. Je suis vietnamienne. J'ai … ans. Je parle français, anglais et vietnamien. Je suis informaticienne. J'habite à Hanoï. J'aime le matcha. Et vous ?")}</p>`}
 ],

function example(e){
  if(!e.nt)return "";
  const parts=e.nt.split(/\s+·\s+/).map(s=>s.trim()).filter(s=>s&&!VI.test(s)&&/\s/.test(s)&&!/^=|≠|^\(|→/.test(s));
  const h=strip(head(e.fr).toLowerCase());
  return parts.find(p=>strip(p.toLowerCase()).includes(h.split(" ")[0]))||parts.find(p=>/[.!?]$/.test(p))||"";
}
function cloze(e){
  const ex=example(e);if(!ex)return null;
  const h=head(e.fr);if(h.length<3)return null;
  const i=ex.toLowerCase().indexOf(h.toLowerCase());if(i<0)return null;
  return {before:ex.slice(0,i),after:ex.slice(i+h.length),ans:h};
}
function accepted(src,lang){
  const base=src.replace(/\[.*?\]/g,"").trim();
  let parts=[base,...base.split(/\s*\/\s*/)];
  if(lang!=="fr")parts=parts.flatMap(p=>[p,...p.split(/\s*[,;]\s*/)]);
  parts=parts.flatMap(p=>[p,p.replace(/\(e\)/g,""),p.replace(/\(e\)/g,"e"),p.replace(/\s*\(.*?\)\s*/g," ")]);
  if(lang==="fr")parts=parts.flatMap(p=>[p,p.replace(ART,"")]);
  if(lang==="en")parts=parts.flatMap(p=>[p,p.replace(/^to\s+/i,"")]);
  return [...new Set(parts.map(norm).filter(Boolean))];
}
function judge(input,answers){
  const lig=x=>x.replace(/œ/g,"oe").replace(/æ/g,"ae");
  const v=lig(norm(input));answers=answers.map(lig);if(!v)return null;
  const a=answers.map(norm);
  if(a.includes(v))return "ok";
  if(a.map(strip).includes(strip(v)))return "accent";
  return "no";
}

const CAPS={5:{due:10,nw:4,ex:2},15:{due:25,nw:8,ex:5},30:{due:50,nw:15,ex:10}};

function planFor(scope){
  const cap=CAPS[S.prefs.min]||CAPS[15];
  let pool=WORDS;if(scope&&scope.topic){pool=pool.filter(e=>e.topic===scope.topic&&(!scope.sub||e.sub===scope.sub));}
  const due=pool.filter(e=>isDue(e.key)).sort((a,b)=>S.srs[a.key].due-S.srs[b.key].due).slice(0,cap.due);
  const nw=pool.filter(e=>!S.srs[e.key]).slice(0,cap.nw);
  let ex=[];
  if(!scope){
    const exDue=EXS.filter(e=>isDue(e.key));
    const exNew=UNITS.flatMap(u=>u.ex.map((x,i)=>EXBYKEY["ex|"+u.id+":"+i])).filter(e=>!S.srs[e.key]&&!S.done[e.u.id+":"+e.i]);
    ex=[...exDue,...exNew].slice(0,cap.ex);
  }
  return {due,nw,ex};
}
function wordItem(e){
  const L=lvl(e.key),c=cloze(e),dir=S.prefs.dir==="mix"?(Math.random()<.5?"fr-vi":"vi-fr"):S.prefs.dir;
  if(L>=2&&c&&Math.random()<.6)return {k:"cloze",e,c};
  if(L>=2&&dir==="vi-fr")return {k:"type",e};
  return {k:"recall",e,dir};
}
const TCAP={5:12,15:30,30:60};
function hintOf(fr){const f=fr.split(/\s+\/\s+/)[0].replace(/\s*\(.*?\)\s*/g," ").trim();const m=f.match(ART);const art=m?m[0]:"";const rest=f.slice(art.length);
  return art+rest.split(" ").map((w,i)=>i===0?w.slice(0,Math.min(2,w.length))+"_".repeat(Math.max(0,w.length-2)):w[0]+"_".repeat(Math.max(0,w.length-1))).join(" ");}
function startTyping(scope,from){
  let pool=WORDS.filter(e=>e.topic===scope.topic&&(!scope.sub||e.sub===scope.sub));
  const due=shuffle(pool.filter(e=>isDue(e.key))),nw=pool.filter(e=>!S.srs[e.key]),rest=shuffle(pool.filter(e=>S.srs[e.key]&&!isDue(e.key)));
  const pick=[...due,...shuffle(nw.slice(0,Math.ceil((TCAP[S.prefs.min]||30)*.6))),...rest].slice(0,TCAP[S.prefs.min]||30);
  const items=shuffle(pick).map(e=>({k:"type",e,lang:S.prefs.tlang||"vi"}));
  sess={items,i:0,res:[],from:from||"lex",scope,typing:true,state:null,requeue:{}};
  S.view="session";save();render();window.scrollTo({top:0});
}
function startSession(scope,from){
  const p=planFor(scope);
  const items=[];
  const dueItems=shuffle(p.due).map(wordItem);
  const exItems=p.ex.map(x=>({k:"ex",ex:x}));
  // từ mới: giới thiệu trước, 2-3 lượt sau hỏi lại ngay
  const newSeq=[];p.nw.forEach(e=>{newSeq.push({k:"intro",e});});
  let d=0,x=0;
  newSeq.forEach((it,i)=>{items.push(it);if(dueItems[d])items.push(dueItems[d++]);if(i%2===1&&exItems[x])items.push(exItems[x++]);items.push({k:"recall",e:it.e,dir:"fr-vi",after:true});});
  while(d<dueItems.length||x<exItems.length){if(dueItems[d])items.push(dueItems[d++]);if(d%4===0&&exItems[x])items.push(exItems[x++]);if(d>=dueItems.length)while(x<exItems.length)items.push(exItems[x++]);}
  // tách các thẻ "hỏi lại" khỏi ngay sau thẻ giới thiệu
  for(let i=0;i<items.length-1;i++){if(items[i].k==="intro"&&items[i+1].after&&i+2<items.length){[items[i+1],items[i+2]]=[items[i+2],items[i+1]];}}
  if(!items.length){sess={items:[],i:0,res:[],from:from||"today",scope};S.view="session";render();return;}
  sess={items,i:0,res:[],from:from||"today",scope,state:null,requeue:{}};
  S.view="session";save();render();window.scrollTo({top:0});
}

let lastVerdict=0;

document.addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;
  const inSession=S.view==="session"&&sess,inLesson=S.view==="lessons"&&S.lesson&&S.stage==="practice";
  if(!inSession&&!inLesson)return;
  if(e.isComposing||e.keyCode===229)return; // bàn phím tiếng Việt đang ghép chữ: chờ lần Enter sau
  e.preventDefault();e.stopImmediatePropagation();
  if(e.repeat)return;
  const ck=$("#a-check"),nx=$("#a-next");
  if(ck){ck.click();return;}
  if(nx&&Date.now()-lastVerdict>450)nx.click();
},true);
document.addEventListener("keydown",e=>{
  if(S.view!=="session"||!sess)return;
  const typing=e.target.matches&&e.target.matches("input");
  if(e.key==="Escape"){$("#q-close")&&$("#q-close").click();return;}
  if(typing)return;
  if(e.key===" "&&$("#a-show")){e.preventDefault();$("#a-show").click();}
  else if(e.key==="Enter"&&$("#a-next")){e.preventDefault();$("#a-next").click();}
  else if(/^[123]$/.test(e.key)&&main.querySelector(`[data-g="${+e.key-1}"]`)){main.querySelector(`[data-g="${+e.key-1}"]`).click();}
  else if(/^[1-4]$/.test(e.key)&&main.querySelector(`.opt[data-j="${+e.key-1}"]`)){main.querySelector(`.opt[data-j="${+e.key-1}"]`).click();}
});

function shrinkImage(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,320/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.82));};im.onerror=rej;im.src=fr.result;};fr.onerror=rej;fr.readAsDataURL(file);});}
